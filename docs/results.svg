<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
  <title id="t">xrperf results: GPU time per frame in S.T.A.L.K.E.R. Anomaly VR</title>
  <desc id="d">GPU time per frame drops from 25.5 ms at native resolution with original settings to 8.9 ms with FSR at 85%, VRS and MSAA 2x, under the 16.7 ms budget for 60 Hz.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #e8eaed; }
    .muted { fill: #9aa3ad; }
    .label { font-size: 15px; }
    .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
  <rect width="900" height="500" rx="16" fill="#12161c"/>

  <text x="40" y="52" font-size="24" font-weight="600">xrperf for S.T.A.L.K.E.R. Anomaly VR</text>
  <text x="40" y="80" font-size="15" class="muted">Full tuning example: xrperf + graphics settings · GPU time per frame, lower is better</text>

  <rect x="40" y="104" width="260" height="78" rx="10" fill="#1b2129"/>
  <text x="58" y="132" font-size="13" class="muted">GPU time per frame</text>
  <text x="58" y="164" font-size="26" font-weight="600">25.5 → 8.9 ms</text>
  <rect x="320" y="104" width="260" height="78" rx="10" fill="#1b2129"/>
  <text x="338" y="132" font-size="13" class="muted">Faster</text>
  <text x="338" y="164" font-size="26" font-weight="600" fill="#3ccf95">2.9×</text>
  <rect x="600" y="104" width="260" height="78" rx="10" fill="#1b2129"/>
  <text x="618" y="132" font-size="13" class="muted">At 60 Hz, with MSAA 2x</text>
  <text x="618" y="164" font-size="26" font-weight="600">0 missed frames</text>

  <line x1="634" y1="212" x2="634" y2="420" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="634" y="440" font-size="13" class="muted" text-anchor="middle">60 Hz frame budget · 16.7 ms</text>

  <text x="40" y="243" class="label">Native, original graphics</text>
  <rect x="300" y="226" width="510" height="26" rx="4" fill="#e34948"/>
  <text x="820" y="244" class="value">25.5 ms</text>

  <text x="40" y="295" class="label">+ FSR at 77% resolution</text>
  <rect x="300" y="278" width="350" height="26" rx="4" fill="#eda100"/>
  <text x="660" y="296" class="value">17.5 ms</text>

  <text x="40" y="347" class="label">+ mod author's graphics settings</text>
  <rect x="300" y="330" width="194" height="26" rx="4" fill="#2a78d6"/>
  <text x="504" y="348" class="value">9.7 ms</text>

  <text x="40" y="399" class="label" font-weight="600">FSR 85% + VRS + MSAA 2x</text>
  <rect x="300" y="382" width="178" height="26" rx="4" fill="#1baf7a"/>
  <text x="488" y="400" class="value">8.9 ms</text>

  <text x="40" y="478" font-size="12" class="muted">RTX 5070 Laptop · WMR headset, 2576×2520 per eye · VR AoE 0.5.0 · same save and spot for every run</text>
</svg>
