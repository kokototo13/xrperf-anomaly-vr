<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">xrperf results: GPU time per frame in S.T.A.L.K.E.R. Anomaly VR</title>
  <desc id="d">At native resolution, the recommended graphics settings cut GPU time per frame from 25.5 ms to 13.4 ms; xrperf with FSR at 85% then brings it to 11.0 ms, under the 16.7 ms budget for 60 Hz.</desc>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #e8eaed; }
    .muted { fill: #9aa3ad; }
    .label { font-size: 15px; }
    .value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
  <rect width="900" height="440" rx="16" fill="#12161c"/>

  <text x="40" y="52" font-size="24" font-weight="600">xrperf for S.T.A.L.K.E.R. Anomaly VR</text>
  <text x="40" y="80" font-size="15" class="muted">GPU time per frame, lower is better · same save and spot for every run</text>

  <rect x="40" y="104" width="260" height="78" rx="10" fill="#1b2129"/>
  <text x="58" y="132" font-size="13" class="muted">Graphics settings</text>
  <text x="58" y="164" font-size="26" font-weight="600">−47%</text>
  <rect x="320" y="104" width="260" height="78" rx="10" fill="#1b2129"/>
  <text x="338" y="132" font-size="13" class="muted">xrperf, FSR at 85%</text>
  <text x="338" y="164" font-size="26" font-weight="600" fill="#3ccf95">−18%</text>
  <rect x="600" y="104" width="260" height="78" rx="10" fill="#1b2129"/>
  <text x="618" y="132" font-size="13" class="muted">Total, steady 60 FPS</text>
  <text x="618" y="164" font-size="26" font-weight="600">25.5 → 11.0 ms</text>

  <line x1="634" y1="212" x2="634" y2="362" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="634" y="382" font-size="13" class="muted" text-anchor="middle">60 Hz frame budget · 16.7 ms</text>

  <text x="40" y="243" class="label">Native, original graphics</text>
  <rect x="300" y="226" width="510" height="26" rx="4" fill="#e34948"/>
  <text x="820" y="244" class="value">25.5 ms</text>

  <text x="40" y="295" class="label">Native, recommended graphics</text>
  <rect x="300" y="278" width="268" height="26" rx="4" fill="#2a78d6"/>
  <text x="578" y="296" class="value">13.4 ms</text>

  <text x="40" y="347" class="label" font-weight="600">+ xrperf, FSR at 85%</text>
  <rect x="300" y="330" width="220" height="26" rx="4" fill="#1baf7a"/>
  <text x="530" y="348" class="value">11.0 ms</text>

  <text x="40" y="420" font-size="12" class="muted">RTX 5070 Laptop · WMR headset, 2576×2520 per eye · VR AoE 0.5.0 · MSAA 2x in all three runs</text>
</svg>
