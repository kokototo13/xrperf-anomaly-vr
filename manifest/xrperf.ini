; xrperf: OpenXR performance layer for S.T.A.L.K.E.R. Anomaly VR
; Read when the game starts. upscaler, sharpness and [foveated] are also picked up
; while the game runs (about a second after saving); render_scale needs a game restart.

[general]
; 0 = the layer passes everything through untouched
enabled=1

; The layer only hooks processes whose exe name contains one of these
; (separated by ;). Every other OpenXR app is left alone.
processes=AnomalyDX11;xrperf_test

; Log files: logs\xrperf.log next to xrperf_layer.dll
log=1

; How often to write frame timing stats to the log, in seconds (0 = off)
stats_interval=5

[resolution]
; Multiplies the per-eye resolution the runtime recommends to the game.
; 1.0 = unchanged. 0.77 / 0.67 / 0.59 / 0.50 = FSR Ultra Quality / Quality / Balanced / Performance.
; The game renders smaller, the layer upscales back to the headset's resolution.
render_scale=0.85

; fsr  = AMD FSR 1 upscaling + sharpening (recommended)
; nis  = NVIDIA Image Scaling
; none = no upscaling in the layer, SteamVR stretches the smaller image (bilinear, for comparison)
; FSR.bat / NIS.bat / OFF.bat switch this in a running game.
upscaler=fsr

; Sharpening for FSR and NIS, 0 (soft) .. 1 (sharpest)
sharpness=0.75

[foveated]
; Fixed foveated rendering with NVIDIA Variable Rate Shading (RTX / GTX 16xx and newer).
; The middle of each eye is shaded at full rate, a ring around it at 1 per 2x2 pixels,
; and the edges at 1 per 4x4 pixels. Switchable in game with VRS_ON.bat / VRS_OFF.bat.
enabled=1

; Radii: 1.0 = edge of the image (measured on each axis, so the zones follow its shape).
; Full rate inside inner_radius, 2x2 up to outer_radius, 4x4 beyond.
inner_radius=0.55
outer_radius=0.80
